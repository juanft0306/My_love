<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5 Meses de Amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- LIRIOS FLOTANTES -->
    <div class="lirio-flotante">🌸</div>
    <div class="lirio-flotante">🌷</div>
    <div class="lirio-flotante">🌺</div>
    <div class="lirio-flotante">🌼</div>
    <div class="lirio-flotante">🌻</div>

    <!-- CANVAS PARA CONFETI -->
    <canvas id="confeti-canvas"></canvas>

    <!-- REPRODUCTOR DE MÚSICA FLOTANTE -->
    <div class="music-player" id="musicPlayer">
        <span class="estado" id="estadoMusica">🎵</span>
        <button id="playBtn">▶️</button>
    </div>

    <!-- BOTÓN DE CONFIGURACIÓN -->
    <button id="configBtn" class="config-btn" title="Configuración">⚙️</button>

    <!-- ====== NUEVO: BOTÓN PARA CUENTO 3D ====== -->
    <button id="btnCuento3d" class="btn-cuento3d">📖 Cuento 3D</button>

    <!-- ====== OVERLAY DEL CUENTO 3D ====== -->
    <div id="cuentoOverlay" class="cuento-overlay">
        <div class="cuento-header">
            <h2>💖 Nuestro Cuento en 3D</h2>
            <button id="cerrarCuento" class="btn-cerrar-cuento">✕</button>
        </div>
        <div id="cuentoCanvasContainer"></div>
        <div class="cuento-controls">
            <button id="btnSiguiente" class="btn-siguiente">Siguiente capítulo ➜</button>
            <span id="indicadorPagina" class="indicador-pagina">1 / 5</span>
        </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN (igual que antes) -->
    <div id="configModal" class="config-modal">
        <!-- ... (mantén el contenido del modal igual que antes) ... -->
        <!-- Por brevedad, no repito todo, pero debe estar completo -->
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <!-- HERO -->
        <section class="hero">
            <h1 id="tituloPrincipal">Felices 5 Meses, Mi Amor</h1>
            <div class="subtitulo" id="subtituloPrincipal">Cada día a tu lado es un regalo</div>
            <div class="polaroid">
                <img id="fotoPolaroid" src="https://via.placeholder.com/400x400/f9e0e0/7a2e3e?text=Tu+Foto+Aqui" alt="Nuestra foto" />
                <div class="caption">Nosotros ❤️</div>
            </div>
            <div class="scroll-indicator">Desliza hacia abajo <span>⌄</span></div>
            <!-- Botón cuento 3D también aquí (opcional) -->
        </section>

        <!-- CONTADOR -->
        <section class="contador">
            <h2>Llevamos juntos</h2>
            <div class="contador-grid" id="contadorGrid">
                <div class="tarjeta-tiempo"><span class="numero" id="dias">00</span><span class="etiqueta">Días</span></div>
                <div class="tarjeta-tiempo"><span class="numero" id="horas">00</span><span class="etiqueta">Horas</span></div>
                <div class="tarjeta-tiempo"><span class="numero" id="minutos">00</span><span class="etiqueta">Minutos</span></div>
                <div class="tarjeta-tiempo"><span class="numero" id="segundos">00</span><span class="etiqueta">Segundos</span></div>
            </div>
        </section>

        <!-- LÍNEA DE TIEMPO (dinámica) -->
        <section class="timeline" id="timelineSection">
            <div id="timelineContainer"></div>
        </section>

        <!-- ACORDEÓN, GUSTOS, CARTA (igual que antes) -->
        <!-- ... (mantén el resto del contenido) ... -->

    </div>

    <!-- ====== SCRIPTS ====== -->
    <!-- Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
