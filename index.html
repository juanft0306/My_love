<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5 Meses de Amor</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="cuento.css" />
</head>
<body>

    <!-- Lirios flotantes -->
    <div class="lirio-flotante">🌸</div>
    <div class="lirio-flotante">🌷</div>
    <div class="lirio-flotante">🌺</div>
    <div class="lirio-flotante">🌼</div>
    <div class="lirio-flotante">🌻</div>

    <!-- Canvas para confeti -->
    <canvas id="confeti-canvas"></canvas>

    <!-- Reproductor musical -->
    <div class="music-player" id="musicPlayer">
        <span class="estado" id="estadoMusica">🎵</span>
        <button id="playBtn">▶️</button>
    </div>

    <!-- Botón de configuración -->
    <button id="configBtn" class="config-btn" title="Configuración">⚙️</button>

    <!-- Botón Cuento 3D -->
    <button id="btnCuento3d" class="btn-cuento3d">📖 Cuento 3D</button>

    <!-- ===== MODAL DE CONFIGURACIÓN (completo) ===== -->
    <div id="configModal" class="config-modal">
        <div class="config-modal-content">
            <span class="config-close" id="configClose">&times;</span>
            <h2>⚙️ Configuración del Sitio</h2>
            <form id="configForm">
                <!-- Fecha, título, subtítulo, foto, canción, colores -->
                <div class="config-group">
                    <label>Fecha de inicio:</label>
                    <input type="datetime-local" id="cfgFechaInicio" />
                </div>
                <div class="config-group">
                    <label>Título principal:</label>
                    <input type="text" id="cfgTitulo" />
                </div>
                <div class="config-group">
                    <label>Subtítulo:</label>
                    <input type="text" id="cfgSubtitulo" />
                </div>
                <div class="config-group">
                    <label>Foto del polaroid:</label>
                    <input type="file" id="cfgFotoFile" accept="image/*" />
                    <div style="margin-top:8px;">
                        <img id="cfgFotoPreview" src="" alt="Vista previa" style="max-width:120px; border-radius:12px; display:none; border:2px solid var(--rose);" />
                    </div>
                </div>
                <div class="config-group">
                    <label>URL de la canción (MP3):</label>
                    <input type="text" id="cfgCancion" />
                </div>
                <div class="config-group">
                    <label>Color vino:</label>
                    <input type="color" id="cfgVino" />
                </div>
                <div class="config-group">
                    <label>Color rosa:</label>
                    <input type="color" id="cfgRosa" />
                </div>

                <!-- Eventos dinámicos -->
                <div style="border-top:2px dashed var(--rose); padding-top:1.5rem; margin-top:1.5rem;">
                    <h3 style="font-family:'Dancing Script',cursive; color:var(--vino);">📅 Eventos</h3>
                    <div id="eventosContainer"></div>
                    <button type="button" id="agregarEventoBtn" class="btn-agregar">➕ Agregar evento</button>
                </div>

                <!-- Acordeón, gustos, carta... (todos los campos) -->
                <!-- ... (incluye todos los campos de texto) ... -->
                <div class="config-actions">
                    <button type="button" id="configGuardar" class="btn-guardar">💾 Guardar Cambios</button>
                    <button type="button" id="configRestaurar" class="btn-restaurar">↩️ Restaurar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== OVERLAY DEL CUENTO 3D ===== -->
    <div id="cuentoOverlay" class="cuento-overlay">
        <div class="cuento-header">
            <h2>💖 Nuestro Cuento</h2>
            <button id="cerrarCuento" class="btn-cerrar-cuento">✕</button>
        </div>
        <div id="cuentoCanvasContainer"></div>
        <div class="cuento-controls">
            <button id="btnSiguiente" class="btn-siguiente">Siguiente capítulo ➜</button>
            <span id="indicadorPagina" class="indicador-pagina">1 / 5</span>
        </div>
    </div>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <div class="container">
        <!-- Hero -->
        <section class="hero">
            <h1 id="tituloPrincipal">Felices 5 Meses, Mi Amor</h1>
            <div class="subtitulo" id="subtituloPrincipal">Cada día a tu lado es un regalo</div>
            <div class="polaroid">
                <img id="fotoPolaroid" src="https://via.placeholder.com/400x400/f9e0e0/7a2e3e?text=Tu+Foto+Aqui" alt="Nuestra foto" />
                <div class="caption">Nosotros ❤️</div>
            </div>
            <div class="scroll-indicator">Desliza hacia abajo <span>⌄</span></div>
        </section>

        <!-- Contador -->
        <section class="contador">
            <h2>Llevamos juntos</h2>
            <div class="contador-grid" id="contadorGrid">
                <div class="tarjeta-tiempo"><span class="numero" id="dias">00</span><span class="etiqueta">Días</span></div>
                <div class="tarjeta-tiempo"><span class="numero" id="horas">00</span><span class="etiqueta">Horas</span></div>
                <div class="tarjeta-tiempo"><span class="numero" id="minutos">00</span><span class="etiqueta">Minutos</span></div>
                <div class="tarjeta-tiempo"><span class="numero" id="segundos">00</span><span class="etiqueta">Segundos</span></div>
            </div>
        </section>

        <!-- Línea de tiempo dinámica -->
        <section class="timeline">
            <div id="timelineContainer"></div>
        </section>

        <!-- Acordeón, gustos, carta (igual que antes) -->
        <!-- ... -->

    </div>

    <!-- ===== SCRIPTS ===== -->
    <!-- Three.js desde CDN (carga asíncrona con defer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" defer></script>

    <!-- Nuestros módulos -->
    <script src="config.js" defer></script>
    <script src="contador.js" defer></script>
    <script src="reproductor.js" defer></script>
    <script src="confeti.js" defer></script>
    <script src="cuento3d.js" defer></script>
    <script src="main.js" defer></script>
</body>
</html>
